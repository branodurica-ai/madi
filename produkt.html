<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mādi – produkt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1791222156">
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<main>
  <div class="wrap crumbs"><a href="index.html">Domov</a> / <a href="index.html#produkty">Produkty</a> / <span id="crumbName"></span></div>
  <section class="pdp"><div class="wrap" id="pdp"></div></section>
  <section class="comp" id="zlozenie" hidden></section>
  <section>
    <div class="wrap">
      <div class="section-head"><h2>Mohlo by sa ti páčiť</h2></div>
      <div class="grid" id="related"></div>
    </div>
  </section>
</main>
<script src="assets/js/products.js?v=1791222156"></script>
<script src="assets/js/app.js?v=1791222156"></script>
<script src="assets/js/buybox.js?v=1791222156"></script>
<script>
(function(){
  const { byId, eur, media } = window.MADI;
  const id = new URLSearchParams(location.search).get("p") || "daily-hydrate";
  const p = byId(id);
  if (p) { document.title = `${p.name} – mādi`; document.getElementById("crumbName").textContent = p.name; }
  window.MADI_BUYBOX(document.getElementById("pdp"), id, true);
  const c = p && p.composition, cs = document.getElementById("zlozenie");
  if (c) {
    cs.hidden = false;
    cs.innerHTML = `<div class="wrap">
      <div class="comp-head"><span class="comp-kicker">Zloženie</span><h2>${c.title}</h2><p>${c.intro}</p></div>
      <div class="comp-grid" style="--n:${c.pillars.length}">${c.pillars.map((pl, i) => `
        <article class="pillar">
          <div class="pillar-head">
            <div class="pillar-top"><span class="pillar-no">0${i + 1}</span><span class="pillar-key">${pl.key}</span></div>
            <h3>${pl.name}</h3>
            <p class="pillar-feel">${pl.feel}</p>
          </div>
          ${pl.items.map(it => `<div class="ing">
            <div class="ing-row"><span class="ing-name">${it.name}</span><span class="ing-dose">${it.dose}</span></div>
            <span class="ing-sub">${it.sub}</span>
            <p>${it.plain}</p>
          </div>`).join("")}
        </article>`).join("")}</div>
      <ul class="comp-not">${c.not.map(n => `<li>${n}</li>`).join("")}</ul>
      <p class="comp-note">${c.note}</p>
    </div>`;
  }
  document.getElementById("related").innerHTML = window.MADI_PRODUCTS.filter(x => x.id !== id).slice(0,3).map(x => `
    <a class="card" href="produkt.html?p=${x.id}">
      <div class="card-media">${media(x)}${x.badge ? `<span class="badge ${x.available ? "" : "soon"}">${x.badge}</span>` : ""}</div>
      <div class="card-body"><span class="card-line">${x.line}</span><span class="card-name">${x.name}</span>${x.subtitle ? `<span class="card-sub">${x.subtitle}</span>` : ""}
      <div class="card-foot"><span class="price">${x.available ? eur(x.price) : "Čoskoro"}</span></div></div>
    </a>`).join("");
})();
</script>
</body>
</html>
