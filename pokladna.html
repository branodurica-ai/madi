<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokladňa – mādi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1791211776">
<style>
  .co{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;padding:48px 0 96px}
  @media (max-width:900px){.co{grid-template-columns:minmax(0,1fr)}.summary{position:static}}
  .co h1{font-family:var(--display);font-weight:400;font-size:48px;margin:0 0 24px}
  .co h2{font-size:20px;font-weight:500;margin:28px 0 12px}
  .f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .f input,.f select{min-width:0;width:100%}
  .f .full{grid-column:1/-1}
  .f label{display:grid;gap:6px;font-size:14px;color:var(--ink-soft)}
  .f input,.f select{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;margin-bottom:10px;cursor:pointer}
  .opt:has(input:checked){border-color:var(--fuchsia);box-shadow:0 0 0 1px var(--fuchsia)}
  .opt input{accent-color:var(--fuchsia)}
  .summary{background:#fff;border-radius:var(--radius-lg);padding:28px;align-self:start;position:sticky;top:100px}
  .row{display:flex;justify-content:space-between;margin:8px 0}
  .row.total{font-size:20px;font-weight:500;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .coupon{display:flex;gap:8px;margin:16px 0}
  .coupon input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:999px;padding:11px 16px}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<main class="wrap">
  <div class="co">
    <form id="coForm" novalidate>
      <h1>Pokladňa</h1>
      <div class="notice">Toto je ukážka pokladne. Platby kartou zapojíme po založení platobnej brány – objednávka sa zatiaľ neodošle.</div>
      <h2>Kontakt</h2>
      <div class="f">
        <label class="full">E-mail<input type="email" autocomplete="email" required></label>
        <label>Meno<input autocomplete="given-name" required></label>
        <label>Priezvisko<input autocomplete="family-name" required></label>
        <label class="full">Telefón<input type="tel" autocomplete="tel"></label>
      </div>
      <h2>Doručenie</h2>
      <label class="opt"><span><input type="radio" name="ship" value="3.49" checked> Packeta – výdajné miesto</span><span data-ship="3.49"></span></label>
      <label class="opt"><span><input type="radio" name="ship" value="4.99"> Kuriér na adresu</span><span data-ship="4.99"></span></label>
      <div class="f" style="margin-top:6px">
        <label class="full">Ulica a číslo<input autocomplete="street-address"></label>
        <label>Mesto<input autocomplete="address-level2"></label>
        <label>PSČ<input autocomplete="postal-code"></label>
        <label class="full">Krajina<select autocomplete="country"><option>Slovensko</option><option>Česko</option></select></label>
      </div>
      <h2>Platba</h2>
      <label class="opt"><span><input type="radio" name="pay" checked> Kartou online</span><span>zadarmo</span></label>
      <label class="opt"><span><input type="radio" name="pay"> Apple Pay / Google Pay</span><span>zadarmo</span></label>
      <button class="btn btn-primary" style="width:100%;margin-top:18px" type="submit" id="payBtn">Objednať a zaplatiť</button>
      <p class="ship-note" id="coMsg" role="status"></p>
    </form>
    <aside class="summary" aria-label="Súhrn objednávky">
      <h2 style="margin-top:0">Tvoja objednávka</h2>
      <div id="sumItems"></div>
      <form class="coupon" id="couponForm"><label class="sr" for="cp">Zľavový kód</label><input id="cp" placeholder="Zľavový kód"><button class="btn btn-ghost" style="padding:10px 18px">Použiť</button></form>
      <div id="sumRows"></div>
    </aside>
  </div>
</main>
<script src="assets/js/products.js?v=1791211776"></script>
<script src="assets/js/app.js?v=1791211776"></script>
<script>
(function(){
  const { byId, eur, store } = window.MADI;
  const codes = { VITAJ5: 0.05, MADIKLUB10: 0.10 };
  let coupon = store.get("madi_coupon", "");
  document.getElementById("cp").value = coupon;
  function ship(){ return +document.querySelector('input[name="ship"]:checked').value; }
  function draw(){
    const cart = window.MADI.getCart();
    const sub = cart.reduce((s,i)=>s+i.unit*i.count,0);
    const disc = codes[coupon] ? sub*codes[coupon] : 0;
    const shipping = (sub - disc) >= window.MADI_FREE_SHIPPING || !cart.length ? 0 : ship();
    document.querySelectorAll("[data-ship]").forEach(s => s.textContent = (sub-disc) >= window.MADI_FREE_SHIPPING ? "zadarmo" : eur(+s.dataset.ship));
    document.getElementById("sumItems").innerHTML = cart.length ? cart.map(i => `<div class="row"><span>${i.count}× ${byId(i.id).name} <small style="color:var(--ink-soft)">(${i.label}${i.sub?", predplatné":""})</small></span><span>${eur(i.unit*i.count)}</span></div>`).join("") : `<p>Košík je prázdny. <a href="index.html#produkty">Vybrať produkty</a></p>`;
    document.getElementById("sumRows").innerHTML = `
      <div class="row"><span>Medzisúčet</span><span>${eur(sub)}</span></div>
      ${disc ? `<div class="row"><span>Zľava ${coupon}</span><span>−${eur(disc)}</span></div>` : ""}
      <div class="row"><span>Doprava</span><span>${shipping ? eur(shipping) : "zadarmo"}</span></div>
      <div class="row total"><span>Spolu</span><span>${eur(sub-disc+shipping)}</span></div>`;
    document.getElementById("payBtn").disabled = !cart.length;
  }
  document.querySelectorAll('input[name="ship"]').forEach(r => r.addEventListener("change", draw));
  document.getElementById("couponForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("cp").value.trim().toUpperCase();
    if (codes[v]) { coupon = v; store.set("madi_coupon", v); window.MADI.toast(`Kód ${v} je uplatnený`); }
    else { coupon = ""; window.MADI.toast("Tento kód nepoznáme. Skontroluj, či je napísaný správne."); }
    draw();
  });
  document.getElementById("coForm").addEventListener("submit", e => {
    e.preventDefault();
    document.getElementById("coMsg").textContent = "Platobná brána ešte nie je zapojená – toto je ukážka. Po zapojení sa tu otvorí platba kartou.";
  });
  draw();
})();
</script>
</body>
</html>
